version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # One PR per week for minor/patch bumps across the 260+ locked crates;
      # major bumps still get their own PR so breaking changes stand out.
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
