name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: mise run lint
        run: mise run lint

      - name: mise run test
        run: mise run test

  macos:
    name: macos
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: cargo build --release -p ndlook-ffi
        run: cargo build --release -p ndlook-ffi

      - name: mise run xcodeproj
        run: mise run xcodeproj

      - name: xcodebuild (unsigned)
        # CI runners have no code signing identity or provisioning
        # profile, so signing is disabled entirely rather than attempting
        # (and failing) an ad-hoc signature. This still exercises the full
        # compile + link of the app and app-extension targets, including
        # linking against libndlook_ffi.a.
        run: |
          xcodebuild \
            -project apple/ndLook.xcodeproj \
            -scheme ndLook \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: mise run test-app
        # NDLookTests is unhosted and headless (it compiles the sources
        # under test directly, never launching the sandboxed app), so it
        # runs fine on a runner with no window session. Signing is disabled
        # for the same reason as the build step; extra args after `--` are
        # appended to the task's xcodebuild invocation by mise.
        run: mise run test-app -- CODE_SIGNING_ALLOWED=NO

  # Builds the release ndlook-ffi staticlib for this PR and for its base
  # branch and posts (or updates) one sticky comment with both sizes and the
  # delta. The two builds are independent, so they run as parallel matrix
  # legs; the report job below joins them. It runs on Linux as a proxy for
  # the macOS artifact the app extension actually links: the same object
  # code (libnetcdf, libhdf5, zstd, icechunk's dependency tree) dominates
  # both, so relative changes track. Report-only: growth never fails the job.
  staticlib_size_build:
    name: staticlib size (${{ matrix.side }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        include:
          - side: head
            manifest: Cargo.toml
            target_dir: target
          - side: base
            manifest: base/Cargo.toml
            target_dir: base/target
    # Each leg sets only its own output; GitHub merges the per-leg outputs
    # because an empty value from the other leg does not overwrite it.
    outputs:
      head: ${{ steps.size.outputs.head }}
      base: ${{ steps.size.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The base leg keeps the PR checkout at the root and builds the base
      # manifest from there, so mise resolves this repo's toolchain pins:
      # its config lookup stops at base/'s own .git boundary, so from inside
      # base/ it would find nothing.
      - name: Checkout base branch
        if: matrix.side == 'base'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      # The ffi crate is looked up from the manifest being built instead of
      # hard-coded so the base leg survives a crate rename: until the rename
      # merges, the base branch still carries the old package name.
      - name: Build staticlib
        env:
          MANIFEST: ${{ matrix.manifest }}
          TARGET_DIR: ${{ matrix.target_dir }}
        run: |
          pkg=$(cargo metadata --no-deps --format-version 1 --manifest-path "$MANIFEST" \
            | jq -r '.packages[].name | select(endswith("-ffi"))')
          cargo build --release -p "$pkg" --manifest-path "$MANIFEST" --target-dir "$TARGET_DIR"

      - name: Record size
        id: size
        env:
          SIDE: ${{ matrix.side }}
          TARGET_DIR: ${{ matrix.target_dir }}
        run: echo "${SIDE}=$(stat -c%s "$TARGET_DIR"/release/lib*_ffi.a)" >> "$GITHUB_OUTPUT"

  staticlib_size:
    name: staticlib size
    runs-on: ubuntu-latest
    needs: staticlib_size_build
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write # post and update the sticky size-report comment
    steps:
      - name: Compose size report
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_BYTES: ${{ needs.staticlib_size_build.outputs.base }}
          HEAD_BYTES: ${{ needs.staticlib_size_build.outputs.head }}
        run: |
          DELTA=$(( HEAD_BYTES - BASE_BYTES ))
          BASE_MB=$(awk "BEGIN { printf \"%.1f\", $BASE_BYTES / 1048576 }")
          HEAD_MB=$(awk "BEGIN { printf \"%.1f\", $HEAD_BYTES / 1048576 }")
          DELTA_MB=$(awk "BEGIN { printf \"%+.1f\", $DELTA / 1048576 }")
          PCT=$(awk "BEGIN { printf \"%+.1f\", ($DELTA / $BASE_BYTES) * 100 }")
          ABS_PCT=$(awk "BEGIN { d = ($DELTA / $BASE_BYTES) * 100; if (d < 0) d = -d; printf \"%.1f\", d }")

          if [ "$DELTA" -lt 0 ]; then
            VERDICT="Size decreased by ${ABS_PCT}%."
          elif [ "$DELTA" = "0" ]; then
            VERDICT="No size change."
          else
            VERDICT="Size increased by ${ABS_PCT}%."
          fi

          {
            echo "<!-- staticlib-size-report -->"
            echo "## libndlook_ffi.a size report"
            echo ""
            echo "| | Size | Bytes |"
            echo "|---|---|---|"
            echo "| Base (\`${BASE_REF}\`) | ${BASE_MB} MiB | ${BASE_BYTES} |"
            echo "| PR | ${HEAD_MB} MiB | ${HEAD_BYTES} |"
            echo "| Delta | ${DELTA_MB} MiB (${PCT}%) | ${DELTA} |"
            echo ""
            echo "${VERDICT}"
            echo ""
            echo "_Release build of \`ndlook-ffi\` on ubuntu-latest, a proxy for the macOS staticlib the app extension links._"
          } > "$RUNNER_TEMP/comment.md"

          # The numbers also land in the log and the run summary, which is
          # all a fork PR gets (see below).
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/comment.md"

      - name: Post size comment
        # A fork's GITHUB_TOKEN can't write comments; the numbers are still
        # in the step above.
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_ID=$(gh api \
            "repos/$GITHUB_REPOSITORY/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.body | contains("<!-- staticlib-size-report -->"))] | first | .id // empty')

          if [ -n "$COMMENT_ID" ]; then
            jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' | \
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/${COMMENT_ID}" --input -
          else
            jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' | \
              gh api "repos/$GITHUB_REPOSITORY/issues/${PR_NUMBER}/comments" --input -
          fi
