name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: mise run lint
        run: mise run lint

      - name: mise run test
        run: mise run test

      - name: prek run --all-files
        run: prek run --all-files

  macos:
    name: macos
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: cargo build --release -p gridlook-ffi
        run: cargo build --release -p gridlook-ffi

      - name: mise run xcodeproj
        run: mise run xcodeproj

      - name: xcodebuild (unsigned)
        # CI runners have no code signing identity or provisioning
        # profile, so signing is disabled entirely rather than attempting
        # (and failing) an ad-hoc signature. This still exercises the full
        # compile + link of the app and app-extension targets, including
        # linking against libgridlook_ffi.a.
        run: |
          xcodebuild \
            -project apple/GridLook.xcodeproj \
            -scheme GridLook \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
