name: Pre-commit (Prek)
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # 2026.8+: honors the `components` list on mise.toml's rust tool,
          # which the cargo-fmt/clippy hooks need (mise sets RUSTUP_TOOLCHAIN,
          # which overrides rust-toolchain.toml, so components must come from
          # the mise rust install itself).
          version: 2026.8.3
      - name: Run pre-commit
        run: |
          prek run \
          --show-diff-on-failure \
          --color always \
          --all-files
