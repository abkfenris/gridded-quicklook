[package]
name = "ndlook-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ndlook_ffi"
crate-type = ["staticlib"]

[dependencies]
ndlook-meta = { workspace = true, features = ["icechunk"] }
ndlook-html.workspace = true
serde_json = "1"

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[dev-dependencies]
tempfile = "3"
