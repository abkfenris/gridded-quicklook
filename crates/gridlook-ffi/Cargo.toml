[package]
name = "gridlook-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "gridlook_ffi"
crate-type = ["staticlib"]

[dependencies]
gridlook-meta = { workspace = true, features = ["icechunk"] }
gridlook-html.workspace = true

[build-dependencies]
cbindgen = { version = "0.28", default-features = false }

[dev-dependencies]
tempfile = "3"
