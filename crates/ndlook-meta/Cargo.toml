[package]
name = "ndlook-meta"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ndlook_meta"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
zarrs_metadata = "0.7"
netcdf = { version = "0.12", features = ["static"] }
# Only for the `_IsNetcdf4` probe in netcdf.rs; everything else goes through
# the safe `netcdf` crate. Same version line `netcdf` itself depends on.
netcdf-sys = "0.9"
thiserror = "2"
icechunk = { version = "2.2.0", default-features = false, features = [
    "object-store-fs",
], optional = true }
# "macros" is only for `try_join!`, which the Icechunk reader uses to run
# the branch and tag listings concurrently on its current-thread runtime.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
], optional = true }
gribberish = { version = "1.7", default-features = false }
memmap2 = "0.9"

[features]
default = []
icechunk = ["dep:icechunk", "dep:tokio"]

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["json", "redactions"] }
# Self dev-dependency: turns the `icechunk` feature on for this crate's own
# tests (Cargo unifies a package's features with its dev-dependencies' when
# building its test targets) so `cargo test -p ndlook-meta` exercises the
# Icechunk reader on its own. Without this the `#[cfg(feature = "icechunk")]`
# tests only ran when the whole workspace was built, because ndlook-ffi's
# dependency happened to enable the feature through feature unification.
# Library consumers are unaffected: dev-dependencies never leak downstream.
ndlook-meta = { path = ".", features = ["icechunk"] }
