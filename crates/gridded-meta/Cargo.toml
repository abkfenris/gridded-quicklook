[package]
name = "gridded-meta"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "gridded_meta"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
netcdf = { version = "0.12", features = ["static"] }
thiserror = "2"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
