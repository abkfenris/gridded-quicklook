# Configuration for `cbindgen`, invoked from `build.rs` to generate
# `apple/include/gridded_ffi.h` from this crate's `#[no_mangle] extern "C"`
# functions. See https://github.com/mozilla/cbindgen/blob/master/docs.md
language = "C"
header = """/* Generated by cbindgen from crates/gridded-ffi. Do not edit by hand;
 * regenerate with `cargo build -p gridded-ffi` (see build.rs). */"""
include_guard = "GRIDDED_FFI_H"
autogen_warning = ""
no_includes = false
sys_includes = ["stdint.h"]
includes = []
tab_width = 2
line_length = 100
documentation = true
documentation_style = "doxy"

[export]
prefix = ""
include = []

[fn]
prefix = ""
postfix = ""
args = "auto"
must_use = ""
