[package]
name = "gridlook-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line inspection of gridded scientific data: NetCDF, HDF5, Zarr, Icechunk"

[[bin]]
name = "gridlook"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
gridlook-meta = { workspace = true, features = ["icechunk", "remote"] }
gridlook-cdl.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
