[package]
name = "gridlook-meta"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "gridlook_meta"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
zarrs_metadata = "0.7"
netcdf = { version = "0.12", features = ["static"] }
# Direct access to libnetcdf inquiry functions the `netcdf` crate does not
# wrap: the `_IsNetcdf4` probe in netcdf.rs and the deflate/filter/storage/
# format queries behind `ncdump -s`-style output. Same version line `netcdf`
# itself depends on; `static` is spelled out so the feature unifies with
# `netcdf/static`.
netcdf-sys = { version = "0.9", features = ["static"] }
thiserror = "2"
icechunk = { version = "2.2.0", default-features = false, features = [
    "object-store-fs",
], optional = true }
tokio = { version = "1", default-features = false, features = [
    "rt",
], optional = true }
# Remote sources (`remote` feature): object stores + HTTP for Zarr and for
# downloading NetCDF files to a temp file before opening them.
object_store = { version = "0.14", default-features = false, features = [
    "fs",
    "http",
    "aws",
    "gcp",
    "azure",
], optional = true }
url = { version = "2", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
tempfile = { version = "3", optional = true }

[features]
default = []
icechunk = ["dep:icechunk", "dep:tokio"]
# http(s)://, s3://, gs://, az:// sources. Also turns on icechunk's matching
# object-store backends when the `icechunk` feature is enabled.
remote = [
    "dep:object_store",
    "dep:url",
    "dep:tempfile",
    "dep:futures-util",
    "dep:tokio",
    "icechunk?/object-store-http",
    "icechunk?/object-store-s3",
    "icechunk?/object-store-gcs",
    "icechunk?/object-store-azure",
]

[dev-dependencies]
insta = { version = "1", features = ["json", "redactions"] }
# Self dev-dependency: turns the `icechunk` feature on for this crate's own
# tests (Cargo unifies a package's features with its dev-dependencies' when
# building its test targets) so `cargo test -p gridlook-meta` exercises the
# Icechunk reader on its own. Without this the `#[cfg(feature = "icechunk")]`
# tests only ran when the whole workspace was built, because gridlook-ffi's
# dependency happened to enable the feature through feature unification.
# Library consumers are unaffected: dev-dependencies never leak downstream.
gridlook-meta = { path = ".", features = ["icechunk"] }
