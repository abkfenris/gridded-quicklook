########################################################################
# XcodeGen spec for the ndLook macOS app + QuickLook preview
# app extension.
#
# Generate the .xcodeproj with `mise run xcodeproj`. Building it
# (`mise run build-app` / `xcodebuild`) needs a full Xcode install.
#
# apple/include/ndlook_ffi.h is generated (not tracked): the prebuild
# script phase below runs `cargo build`, whose build.rs writes the header
# before Xcode compiles any Swift that imports it.
#
# Linking note (verified by hand -- see crates/ndlook-ffi's build notes):
# `cargo build --release -p ndlook-ffi` produces a `staticlib` that already
# has libnetcdf, libhdf5, and libz's object code merged into it (Rust's
# staticlib output absorbs the object files of every native static library
# it transitively links against). DAP/remote support is compiled out of
# netcdf-src, so no libcurl is pulled in at all. A hand link test
# (`clang main.c -Lapple/../target/release -lndlook_ffi`) confirmed that
# `-lndlook_ffi` alone resolves cleanly with no extra `-lz`/-lcurl/-lnetcdf/
# -lhdf5 flags needed -- only the ordinary macOS system libraries. Since the
# Icechunk reader was added the one exception is `-framework
# CoreFoundation` (see OTHER_LDFLAGS below); zstd, flatbuffers and the rest
# of icechunk's native code are absorbed into the staticlib as before.
#
# Icon note: App/Assets.xcassets is generated from the SVG sources in
# docs/icon (`mise run icons`): AppIcon.appiconset holds one PNG per macOS
# slot, with reduced artwork in the 16 and 32 pt slots, and
# DocumentBadge.imageset is the badge the system composes onto the .zarr /
# .icechunk document icons (UTTypeIcons in App/Info.plist). xcodegen picks
# the catalog up as a resource because it sits under the App source path.
#
# UTI note: the type declarations themselves live in the two Info.plist
# files referenced below (App/Info.plist declares them, PreviewExtension/
# Info.plist matches against them in QLSupportedContentTypes), not in this
# spec -- xcodegen copies INFOPLIST_FILE through verbatim. The app imports
# com.alexkerney.ndlook.netcdf/.hdf5 (file types) and exports com.alexkerney.ndlook.zarr/
# .icechunk (directory stores, conforming to com.apple.package so the
# Finder treats them as previewable single items). ndLook is itself a
# viewer/opener for these types -- App/Info.plist's CFBundleDocumentTypes
# (added in a later step) is what makes the Finder offer it as an "Open
# With" target, on top of the UTI declarations here.
########################################################################

name: ndLook

options:
  bundleIdPrefix: com.alexkerney.ndlook
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-" # ad-hoc signing for local development
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ndLook:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexkerney.ndlook
        PRODUCT_NAME: ndLook
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: App/BridgingHeader.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/../target/release
        OTHER_LDFLAGS:
          - -lndlook_ffi
          # See the identical flag on PreviewExtension's OTHER_LDFLAGS below
          # for why this is needed alongside -lndlook_ffi (icechunk's
          # chrono dependency resolving the system time zone through
          # CoreFoundation).
          - -framework
          - CoreFoundation
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    # This target links ndlook-ffi's staticlib (OTHER_LDFLAGS above) but
    # has no prebuild script of its own to build it -- it relies on Xcode
    # building the PreviewExtension dependency below (and that target's
    # "Build ndlook-ffi (cargo)" prebuild script) before this target
    # links. If PreviewExtension is ever removed, that prebuild script must
    # move to this target instead.
    dependencies:
      - target: PreviewExtension
        embed: true
        codeSign: true

  PreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: PreviewExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexkerney.ndlook.preview
        PRODUCT_NAME: PreviewExtension
        INFOPLIST_FILE: PreviewExtension/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: PreviewExtension/BridgingHeader.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/../target/release
        OTHER_LDFLAGS:
          - -lndlook_ffi
          # Required since the Icechunk reader was added: icechunk pulls in
          # chrono -> iana-time-zone, which resolves the system time zone
          # through CoreFoundation (CFTimeZoneCopySystem and friends).
          # Verified by hand-linking the release staticlib -- without this
          # flag the link fails with undefined _CFTimeZone*/_CFString*
          # symbols; with it, `-lndlook_ffi` still needs no other extra
          # libraries.
          - -framework
          - CoreFoundation
        SKIP_INSTALL: YES
    entitlements:
      path: PreviewExtension/PreviewExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    # Keeps `xcodebuild`/Xcode builds self-contained: building the app
    # extension target always (re)builds the Rust staticlib it links
    # against first, so a clean checkout can go straight to
    # `mise run build-app` without a separate cargo step.
    #
    # `basedOnDependencyAnalysis: false` forces this to run on every build
    # (cargo does its own up-to-date checking internally, so this is cheap
    # on a no-op build) rather than only when Xcode thinks its declared
    # inputs/outputs changed, which it can't know about for an external
    # build system.
    prebuildScripts:
      - name: Build ndlook-ffi (cargo)
        # Xcode exports SDKROOT/MACOSX_DEPLOYMENT_TARGET into script phases,
        # which poisons the C builds inside cargo's dependency tree (they are
        # host-tool builds, not appex code) and invalidates the fingerprints
        # of the staticlib built from the CLI. Xcode's PATH also misses the
        # mise shims, so cmake can resolve to an unpinned system/Homebrew
        # cmake that HDF5's vendored build doesn't support. Run cargo through
        # the mise shims with those variables stripped so this phase produces
        # the exact same artifact as `cargo build` in a terminal.
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          PATH="$HOME/.local/share/mise/shims:$PATH" \
            env -u SDKROOT -u MACOSX_DEPLOYMENT_TARGET -u DEVELOPER_DIR \
            cargo build --release -p ndlook-ffi
        basedOnDependencyAnalysis: false
